<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | The Mishmar</title>

  <link rel="stylesheet" href="mainStyle.css">
  <link rel="stylesheet" href="login.css">
</head>

<body>
{% include nav %}
  <main class="login-page">

    <div class="login-box">

      <div class="form-eyebrow">THE MISHMAR</div>

      <h1>Login</h1>

      <div class="gold-line"></div>

      <form id="loginForm">

        <div class="login-field">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
          >
        </div>

        <div class="login-field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <input type="hidden" name="action" id="action" value="login">
        <button type="submit" class="hero-action login-button">
          LOGIN
        </button>

      </form>

    </div>

  </main>


<script>

  const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPqt6IR2eQhtA5tWA4RAbGVM7_WoWzOinF0cq-_Vyr9Cq0ifudeZ37zCik0wVqbxAF/exec";

  document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const formData = new FormData(this);

    try {

      const response = await fetch(APP_SCRIPT_URL, {
        method: "POST",
        body: new URLSearchParams(formData)
      });

      const result = (await response.text()).trim();

      console.log("Apps Script response:", result);

      if (result) {
        window.location.href = result;
      } else {
        alert("wrong username or password, please try again");
      }

    } catch (error) {

      console.error("Login error:", error);
      alert("Unable to connect. Please try again.");

    }

  });

</script>
{% include footer %}
</body>
</html>
