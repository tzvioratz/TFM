          modalText: |
           Program Rules
           
           To preserve the atmosphere and ensure that every participant can benefit from the program, the following rules apply at every Mishmar location:
           
           ◆  No phones or other personal technology during the program.
           
           ◆  No smoking, vaping, or items or devices not allowed in a school setting.
           
           ◆  Participants must remain inside the program area and may not leave or hang around outside during program time.
           
           ◆  Every participant must be properly registered. Program rules and expectations must be reviewed and signed by a parent or guardian.
          required: true

           