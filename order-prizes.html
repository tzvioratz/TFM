<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Prizes</title>
<link rel="stylesheet" href="mainStyle.css">

</head>

<body>




<div class="form-page">

  <div class="form-header">
    <div class="form-eyebrow">THE MISHMAR</div>
    <h1>Prize Order Form</h1>
    
  </div>
    {% include nav %}

  <div id="formContainer" claPrize_orderss="form-container">
    
    <form id="mainForm" method="POST"  action="" onsubmit="submitted=true;">
      <input type="hidden" name="action" id="action" value="submit">
      <input type="hidden" name="sheet" id="sheet" value="prize order">
            {% include form-container2.html step="1" data=site.data.prize-order.prize1 %}
            {% include form-container2.html step="2" data=site.data.prize-order.prize2 %}
            


           
                

            <div class="container">
                <div class="section">
                  <div class="row">
                      <div class="field-wrapper">
                          <button id="submitBtn" type="submit" class="hero-action form-submit">Submit</button>
                      </div>
                  </div>
              </div>
            </div>
        </form>
</div>
  </div>
  
<!-- Add this anywhere in your <body> -->
<div id="loading-overlay" style="display: none;">
  <div class="spinner"></div>
</div>


<script>

  

  document.addEventListener("DOMContentLoaded", function () {

  document.querySelectorAll(".yesno-trigger").forEach(select => {
    const detailsName = select.dataset.details;
    const detailsInput = document.querySelector(`input[name="${detailsName}"]`);

    if (!detailsInput) return;

    function update() {
      if (select.value === "Yes" || select.value === "Past") {
        detailsInput.disabled = false;
        detailsInput.required = true;
      } else {
        detailsInput.disabled = true;
        detailsInput.required = false;
        detailsInput.value = "";
      }
    }

    select.addEventListener("change", update);

    // run once on load (important for prefilled forms)
    update();
  });

});
  
  document.addEventListener("DOMContentLoaded", function () {

  // open modal
  document.querySelectorAll(".open-modal").forEach(btn => {
    btn.addEventListener("click", () => {
      const name = btn.dataset.target;
      const modal = document.getElementById("modal-" + name.replaceAll('.', '_'));
      if (modal){
        modal.style.display = "block";
        document.body.style.overflow = "hidden";
      } 
    });
  });
    
    // close modal via x buttom 
    document.querySelectorAll(".modal-close").forEach(btn => {
    btn.addEventListener("click", () => {
      const name = btn.dataset.target;
      const modal = document.getElementById("modal-" + name.replaceAll('.', '_'));
      if (modal) {
        modal.style.display = "none";
        document.body.style.overflow = "auto";
      }
    });
  });
    

  // accept
document.querySelectorAll(".accept-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const name = btn.dataset.target;
    

    const input = document.querySelector(`input[name="${name}"]`);
    const button = document.getElementById("btn-" + name.replaceAll('.', '_'));

    if (input) {
      const timestamp = new Date().toISOString();
      input.value = timestamp;

      //  update UI state
      if (button) {
        button.textContent = "Accepted ✓";
        button.classList.add("accepted");
        document.body.style.overflow = "auto";
      }
    }

    const modal = document.getElementById("modal-" + name.replaceAll('.', '_'));
    if (modal) modal.style.display = "none";
  });
});

});
  document.addEventListener("DOMContentLoaded", function () {

  document.querySelectorAll("input[type='hidden']").forEach(input => {
    if (input.value) {
      const name = input.name;
      const button = document.getElementById("btn-" + name.replaceAll('.', '_'));

      if (button) {
        button.textContent = "Accepted ✓";
        button.classList.add("accepted");
      }
    }
  });

});
;
</script>
  
  <script>
    const form = document.getElementById("mainForm");
    const loader = document.getElementById("loading-overlay");
    
    function showLoader() {
      loader.style.display = "flex";
    }

    function hideLoader() {
      loader.style.display = "none";
    }

// 1. Validation step
    function validateForm() {
      const required = form.querySelectorAll("input[type='hidden'][required]");

      for (let input of required) {
        if (!input.value) {
          alert("Please accept required agreements.");
          return false;
        }
      }

      return true;
    }


    
    // 3. Main submit pipeline
const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPqt6IR2eQhtA5tWA4RAbGVM7_WoWzOinF0cq-_Vyr9Cq0ifudeZ37zCik0wVqbxAF/exec";
form.addEventListener("submit", async function (e) {
  e.preventDefault();

  try {
    // STEP 1: validate
    if (!validateForm()) {
      return;
    }

    // STEP 2: show loader ONLY when we are really submitting
    showLoader();

    // STEP 3: send form to Google Apps Script
    const formData = new FormData(form);

    const response = await fetch(APP_SCRIPT_URL, {
      method: "POST",
      body: new URLSearchParams(formData)
    });

    // STEP 4: get redirect URL from Apps Script
    const redirectUrl = (await response.text()).trim();

    if (redirectUrl) {
      // Apps Script returned a URL
      window.location.href = redirectUrl;
    } else {
      // Apps Script did not return a URL
      hideLoader();
      alert("Something went wrong. Please try again.");
    }

  } catch (err) {
    console.error(err);
    hideLoader();
    alert("Something went wrong. Please try again.");
  }
});

    
  </script>
  
{% include footer %}
</body>
</html>
